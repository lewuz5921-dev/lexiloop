<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本机存储模式 - 词境 LexiLoop</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M21 17h8v24h14v6H21z' fill='white'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full space-y-8">
        <!-- Logo -->
        <div class="text-center space-y-3">
            <div class="bg-indigo-600 text-white p-4 rounded-2xl shadow-lg shadow-indigo-100 inline-block">
                <i class="fa-solid fa-graduation-cap text-3xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900">LexiLoop</h1>
            <p class="text-slate-500 text-sm">词境 · 雅思语境背词</p>
        </div>

        <!-- 说明卡片 -->
        <div class="bg-white rounded-3xl border border-slate-100 shadow-xl p-8 space-y-6">
            <div class="flex items-start space-x-3">
                <div class="bg-emerald-50 text-emerald-600 p-2.5 rounded-xl shrink-0">
                    <i class="fa-solid fa-database"></i>
                </div>
                <div class="space-y-1">
                    <h2 class="font-bold text-slate-900">无需注册，进度存本机</h2>
                    <p class="text-sm text-slate-500 leading-relaxed">
                        当前版本为纯静态单页应用，不设账号体系。你的筛选结果、已掌握词与复习时间
                        都保存在这台设备的浏览器里，关掉页面明天再来还在。
                    </p>
                </div>
            </div>

            <div class="space-y-3 pt-2 border-t border-slate-100">
                <div class="flex items-start space-x-3 text-sm text-slate-600">
                    <i class="fa-solid fa-circle-check text-emerald-500 mt-0.5"></i>
                    <span>换浏览器、清理缓存或换设备，进度不会跟着走。</span>
                </div>
                <div class="flex items-start space-x-3 text-sm text-slate-600">
                    <i class="fa-solid fa-key text-indigo-500 mt-0.5"></i>
                    <span>AI 短文需要你在应用右上角「填 API Key」处填一个自己的 DeepSeek Key，Key 只存在本机。</span>
                </div>
            </div>

            <button onclick="enterApp()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-indigo-100 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-arrow-right"></i>
                <span>开始背单词</span>
            </button>
        </div>

        <p class="text-center text-xs text-slate-400">
            旧版本的邮箱 / Google 登录已随云端后端一起下线
        </p>
    </div>

    <script>
        // 写入本机标记后进入主应用
        function enterApp() {
            try { localStorage.setItem("lexiloop_guest", "1"); } catch (e) {}
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
